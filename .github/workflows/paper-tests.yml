name: Paper trading reference tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  paper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: paper_trading/requirements.txt
      - run: python -m pip install -r paper_trading/requirements.txt
      - run: python -m unittest discover -s paper_trading -p 'test_*.py' -v
      - run: python -m unittest discover -s research/multicurrency-20260917 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/edge-search-20260917 -p 'test_*.py' -v
      - run: python -m compileall -q paper_trading research/multicurrency-20260917 research/edge-search-20260917
