[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-ml-research"
version = "0.1.0"
description = "Chronological machine-learning research for short-horizon USD/JPY trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.4,<2"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "matplotlib>=3.8,<4", "yfinance>=0.2,<1", "mplfinance>=0.12.10b0,<0.13"]

[project.scripts]
fx-quality = "fx_research.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
